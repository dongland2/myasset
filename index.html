<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>배당 자산 관리 포트폴리오</title>

    <!-- iOS 사파리 홈 화면 추가(PWA) 지원 메타 태그 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="배당포트폴리오">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2454/2454282.png">

    <!-- 외부 라이브러리 CDN (Tailwind CSS, FontAwesome, Chart.js) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* 모바일 터치 환경 최적화 */
        body {
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        }
        /* 스크롤바 숨김 처리 */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen pb-24">

    <!-- 상단 네비게이션 헤더 -->
    <header class="sticky top-0 z-30 bg-gray-900/90 backdrop-blur-md border-b border-gray-800 px-4 py-3 flex justify-between items-center">
        <div>
            <h1 class="text-lg font-bold text-emerald-400 flex items-center gap-2">
                <i class="fa-solid fa-chart-pie"></i> 내 배당 포트폴리오
            </h1>
            <p class="text-xs text-gray-400" id="headerExchangeRate">환율: 불러오는 중...</p>
        </div>
        <div class="flex gap-2">
            <button onclick="openDripModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow-md shadow-indigo-600/30 active:scale-95 transition">
                <i class="fa-solid fa-seedling"></i> DRIP
            </button>
            <button onclick="openModal()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow-md shadow-emerald-500/30 active:scale-95 transition">
                <i class="fa-solid fa-plus"></i> 종목 추가
            </button>
            <button onclick="exportData()" class="bg-gray-800 text-gray-300 hover:text-white px-2.5 py-1.5 rounded-lg text-xs" title="데이터 백업">
                <i class="fa-solid fa-download"></i>
            </button>
            <label class="bg-gray-800 text-gray-300 hover:text-white px-2.5 py-1.5 rounded-lg text-xs cursor-pointer" title="데이터 복원">
                <i class="fa-solid fa-upload"></i>
                <input type="file" id="importFileInput" onchange="importData(event)" class="hidden" accept=".json">
            </label>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- 총 자산 및 배당 대시보드 요약 카드 -->
        <section class="bg-gradient-to-br from-gray-800 to-gray-850 p-5 rounded-2xl border border-gray-700/60 shadow-xl">
            <div class="flex justify-between items-start mb-2">
                <span class="text-xs font-semibold text-gray-400">총 평가 자산</span>
                <span id="totalProfitBadge" class="text-xs px-2 py-0.5 rounded-full font-bold bg-gray-700 text-gray-300">+0.0%</span>
            </div>
            <div class="text-2xl font-black tracking-tight text-white mb-4" id="totalAssetValue">0원</div>

            <!-- 자산 세부 통계 그리드 -->
            <div class="grid grid-cols-2 gap-3 pt-3 border-t border-gray-700/50 text-xs">
                <div>
                    <p class="text-gray-400">총 매수 금액</p>
                    <p class="font-bold text-gray-200 mt-0.5" id="totalInvested">0원</p>
                </div>
                <div>
                    <p class="text-gray-400">총 평가 손익</p>
                    <p class="font-bold mt-0.5" id="totalProfitLoss">0원</p>
                </div>
                <div>
                    <p class="text-emerald-400 font-semibold">연간 세전 배당금</p>
                    <p class="font-bold text-emerald-300 mt-0.5" id="totalAnnualDividend">0원</p>
                </div>
                <div>
                    <p class="text-emerald-400 font-semibold">월평균 세후 배당금(15.4%)</p>
                    <p class="font-bold text-emerald-300 mt-0.5" id="monthlyNetDividend">0원</p>
                </div>
            </div>
        </section>

        <!-- 차트 영역 (월별 배당금 / 포트폴리오 비중 전환 탭) -->
        <section class="bg-gray-800/80 p-4 rounded-2xl border border-gray-700/60 shadow-lg">
            <div class="flex justify-between items-center mb-3">
                <div class="flex gap-2">
                    <button id="tabMonthlyBtn" onclick="switchChartTab('monthly')" class="text-xs font-bold px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">
                        <i class="fa-solid fa-calendar-days"></i> 월별 배당금
                    </button>
                    <button id="tabPieBtn" onclick="switchChartTab('pie')" class="text-xs font-bold px-2.5 py-1 rounded-lg bg-gray-700/50 text-gray-400 hover:text-gray-200">
                        <i class="fa-solid fa-chart-pie"></i> 종목별 비중
                    </button>
                </div>
            </div>

            <!-- 월별 배당 막대 차트 컨테이너 -->
            <div id="monthlyChartWrapper" class="relative h-48 w-full">
                <canvas id="monthlyDividendChart"></canvas>
            </div>

            <!-- 자산 비중 도넛 차트 컨테이너 -->
            <div id="pieChartWrapper" class="relative h-48 w-full hidden">
                <canvas id="assetPieChart"></canvas>
            </div>
        </section>

        <!-- 보유 종목 리스트 섹션 -->
        <section class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-sm font-bold text-gray-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-list-check text-blue-400"></i> 보유 종목 현황 (<span id="stockCount">0</span>)
                </h2>
                <button onclick="refreshAllStockData()" class="text-xs text-emerald-400 hover:text-emerald-300 flex items-center gap-1">
                    <i class="fa-solid fa-rotate" id="refreshIcon"></i> 시세 일괄 갱신
                </button>
            </div>

            <!-- 보유 종목 카드 동적 렌더링 영역 -->
            <div id="stockListContainer" class="space-y-3">
                <!-- 자바스크립트에 의해 카드가 삽입됩니다 -->
            </div>
        </section>
    </main>

    <!-- 1. 종목 추가 / 수정 모달 -->
    <div id="stockModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center hidden">
        <div class="bg-gray-800 w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl border border-gray-700 p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-gray-700 pb-3">
                <h3 class="text-base font-bold text-white" id="modalTitle">종목 추가</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="stockForm" onsubmit="saveStock(event)" class="space-y-3 text-xs">
                <input type="hidden" id="editIndex" value="-1">

                <!-- 시장 선택 (미국 / 한국) -->
                <div>
                    <label class="block text-gray-400 font-semibold mb-1">시장 선택</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="flex items-center justify-center p-2 rounded-lg bg-gray-700/60 border border-gray-600 cursor-pointer has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-500/10">
                            <input type="radio" name="marketType" value="KR" class="hidden" checked onchange="handleMarketChange()">
                            <span class="font-bold text-gray-200">🇰🇷 한국 주식 (KRW)</span>
                        </label>
                        <label class="flex items-center justify-center p-2 rounded-lg bg-gray-700/60 border border-gray-600 cursor-pointer has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-500/10">
                            <input type="radio" name="marketType" value="US" class="hidden" onchange="handleMarketChange()">
                            <span class="font-bold text-gray-200">🇺🇸 미국 주식 (USD)</span>
                        </label>
                    </div>
                </div>

                <!-- 검색어 / 종목코드 입력란 -->
                <div>
                    <label class="block text-gray-400 font-semibold mb-1">종목명 또는 코드/티커</label>
                    <div class="flex gap-2">
                        <input type="text" id="inputTicker" required placeholder="예: 삼성전자, 005930, AAPL, SCHD" class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                        <button type="button" id="searchBtn" onclick="fetchLiveStockInfo()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg font-semibold whitespace-nowrap flex items-center gap-1 active:scale-95 transition">
                            <i class="fa-solid fa-magnifying-glass"></i> 실시간 조회
                        </button>
                    </div>
                    <p class="text-[10px] text-gray-400 mt-1">💡 한글 종목명, 6자리 코드, 미국 티커 모두 실시간 조회가 가능합니다.</p>
                </div>

                <!-- 종목명 -->
                <div>
                    <label class="block text-gray-400 font-semibold mb-1">종목명</label>
                    <input type="text" id="inputName" required placeholder="예: 삼성전자 / 애플" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>

                <!-- 수량 & 평단가 -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-gray-400 font-semibold mb-1">보유 수량 (주)</label>
                        <input type="number" step="any" id="inputQuantity" required placeholder="0" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 font-semibold mb-1" id="buyPriceLabel">평균 매수가 (원)</label>
                        <input type="number" step="any" id="inputBuyPrice" required placeholder="0" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <!-- 현재가 & DPS -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-gray-400 font-semibold mb-1" id="currentPriceLabel">현재 주가 (원)</label>
                        <input type="number" step="any" id="inputCurrentPrice" required placeholder="0" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 font-semibold mb-1" id="dpsLabel">주당 연간 배당금 (DPS)</label>
                        <input type="number" step="any" id="inputDPS" required placeholder="0" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <!-- 배당 주기 -->
                <div>
                    <label class="block text-gray-400 font-semibold mb-1">배당 주기</label>
                    <select id="inputDivCycle" onchange="handleCycleChange()" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                        <option value="quarterly">분기 배당 (연 4회)</option>
                        <option value="monthly">월 배당 (연 12회)</option>
                        <option value="semiannual">반기 배당 (연 2회)</option>
                        <option value="annual">연 배당 (연 1회)</option>
                    </select>
                </div>

                <!-- 지급월 체크박스 -->
                <div id="payoutMonthsContainer">
                    <label class="block text-gray-400 font-semibold mb-1">배당 지급월 선택</label>
                    <div class="grid grid-cols-6 gap-1 text-center">
                        <script>
                            for(let m=1; m<=12; m++) {
                                document.write(`
                                    <label class="p-1 rounded bg-gray-700/50 border border-gray-600 cursor-pointer has-[:checked]:bg-emerald-600 has-[:checked]:text-white">
                                        <input type="checkbox" name="payoutMonth" value="${m}" class="hidden">
                                        <span class="text-[11px] font-bold">${m}월</span>
                                    </label>
                                `);
                            }
                        </script>
                    </div>
                </div>

                <div class="pt-3 flex gap-2">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-gray-300 py-2.5 rounded-lg font-bold">취소</button>
                    <button type="submit" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white py-2.5 rounded-lg font-bold shadow-lg shadow-emerald-500/20">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. 배당 재투자(DRIP) 시뮬레이터 모달 -->
    <div id="dripModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center hidden">
        <div class="bg-gray-800 w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl border border-gray-700 p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-gray-700 pb-3">
                <h3 class="text-base font-bold text-white flex items-center gap-1.5">
                    <i class="fa-solid fa-seedling text-indigo-400"></i> 배당 재투자(DRIP) 시뮬레이터
                </h3>
                <button onclick="closeDripModal()" class="text-gray-400 hover:text-white text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-gray-400 font-semibold mb-1">시뮬레이션 기간</label>
                    <select id="dripYears" onchange="runDripSimulation()" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white">
                        <option value="5">5년 후</option>
                        <option value="10" selected>10년 후</option>
                        <option value="15">15년 후</option>
                        <option value="20">20년 후</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-gray-400 font-semibold mb-1">연간 주가 상승률 (%)</label>
                        <input type="number" id="dripPriceGrowth" value="4" step="0.5" oninput="runDripSimulation()" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white">
                    </div>
                    <div>
                        <label class="block text-gray-400 font-semibold mb-1">연간 배당 성장률 (%)</label>
                        <input type="number" id="dripDivGrowth" value="5" step="0.5" oninput="runDripSimulation()" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white">
                    </div>
                </div>

                <div class="bg-gray-900/80 p-3 rounded-xl border border-gray-700 space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-400">미래 총 예상 자산 (DRIP)</span>
                        <span class="font-bold text-indigo-400 text-sm" id="dripFinalAsset">0원</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-400">미래 세후 월배당금</span>
                        <span class="font-bold text-emerald-400 text-sm" id="dripFinalMonthlyDiv">0원</span>
                    </div>
                </div>

                <div class="relative h-44 w-full pt-2">
                    <canvas id="dripChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- 핵심 비즈니스 로직 스크립트 -->

        // 1. 실시간 달러-원 환율 조회 (무료 공개 오픈 API)
        async function fetchExchangeRate() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await res.json();
                if (data && data.rates && data.rates.KRW) {
                    usdKrwRate = data.rates.KRW;
                    document.getElementById('headerExchangeRate').innerText = `환율: 1$ = ${usdKrwRate.toLocaleString('ko-KR', { maximumFractionDigits: 1 })}원`;
                }
            } catch (err) {
                document.getElementById('headerExchangeRate').innerText = `환율: 1$ = ${usdKrwRate.toLocaleString()}원`;
            }
        }

        // 2. 타임아웃 지원 안전 Fetch 함수 (3.5초 초과 시 자동 중단)
        async function fetchWithTimeout(url, timeoutMs = 3500) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(timer);
                return res;
            } catch (err) {
                clearTimeout(timer);
                throw err;
            }
        }

        // 다중 프록시를 순차 탐색하여 JSON 파싱 (무한 대기 방지)
        async function fetchYahooChartData(symbol) {
            const target = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=1y&events=div`;
            
            const proxyUrls = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`,
                `https://corsproxy.io/?url=${encodeURIComponent(target)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(target)}`
            ];

            for (const pUrl of proxyUrls) {
                try {
                    const res = await fetchWithTimeout(pUrl, 3500);
                    if (res.ok) {
                        const json = await res.json();
                        if (json && json.chart && json.chart.result && json.chart.result.length > 0) {
                            return json.chart.result[0];
                        }
                    }
                } catch (e) {
                    // 다음 프록시로 빠르게 전환
                }
            }
            throw new Error('실시간 데이터 통신 실패');
        }

        // 3. 지능형 종목 검색 및 실시간 시세/배당 동시 반영
        async function fetchLiveStockInfo() {
            const inputRaw = document.getElementById('inputTicker').value.trim();
            if (!inputRaw) {
                alert('종목명 또는 코드를 입력해주세요.');
                return;
            }

            const searchBtn = document.getElementById('searchBtn');
            const originalHtml = searchBtn.innerHTML;
            searchBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 실시간 조회중';
            searchBtn.disabled = true;

            try {
                let querySymbol = '';
                let resolvedName = '';
                let resolvedMarket = document.querySelector('input[name="marketType"]:checked').value;

                // [1단계] 한글 매핑 맵 확인
                const upperRaw = inputRaw.toUpperCase();
                if (STOCK_SYMBOL_MAP[inputRaw]) {
                    querySymbol = STOCK_SYMBOL_MAP[inputRaw].ticker;
                    resolvedName = STOCK_SYMBOL_MAP[inputRaw].name;
                    resolvedMarket = STOCK_SYMBOL_MAP[inputRaw].market;
                } else if (/^[0-9]{6}$/.test(inputRaw)) {
                    // 한국 주식 6자리 숫자 코드 (예: 005930)
                    querySymbol = `${inputRaw}.KS`;
                    resolvedName = inputRaw;
                    resolvedMarket = 'KR';
                } else if (inputRaw.includes('.KS') || inputRaw.includes('.KQ')) {
                    querySymbol = inputRaw;
                    resolvedName = inputRaw;
                    resolvedMarket = 'KR';
                } else {
                    // 미국 티커로 간주 (예: AAPL, SCHD, O)
                    querySymbol = upperRaw;
                    resolvedName = upperRaw;
                    resolvedMarket = 'US';
                }

                // [2단계] 야후 파이낸스 실시간 시세 및 1년 배당 내역 호출
                let chartResult = null;
                try {
                    chartResult = await fetchYahooChartData(querySymbol);
                } catch (err) {
                    // 코스피(.KS) 실패 시 코스닥(.KQ) 시도
                    if (querySymbol.endsWith('.KS')) {
                        const kqSymbol = querySymbol.replace('.KS', '.KQ');
                        chartResult = await fetchYahooChartData(kqSymbol);
                        querySymbol = kqSymbol;
                    } else {
                        throw err;
                    }
                }

                const meta = chartResult.meta;
                const livePrice = meta.regularMarketPrice || meta.chartPreviousClose || 0;
                const fetchedName = meta.shortName || meta.symbol || resolvedName;

                // [3단계] 1년 치 실제 지급 배당금(DPS) 및 지급월 합산
                let annualDPS = 0;
                const payoutMonths = new Set();
                const divEvents = chartResult.events?.dividends;

                if (divEvents) {
                    for (const key in divEvents) {
                        const divItem = divEvents[key];
                        if (divItem.amount) {
                            annualDPS += Number(divItem.amount);
                        }
                        if (divItem.date) {
                            const month = new Date(divItem.date * 1000).getMonth() + 1;
                            payoutMonths.add(month);
                        }
                    }
                }

                // [4단계] 입력 폼 자동 반영
                document.querySelector(`input[name="marketType"][value="${resolvedMarket}"]`).checked = true;
                handleMarketChange();

                document.getElementById('inputTicker').value = querySymbol.replace('.KS', '').replace('.KQ', '');
                document.getElementById('inputName').value = resolvedName || fetchedName;
                document.getElementById('inputCurrentPrice').value = livePrice;
                document.getElementById('inputDPS').value = annualDPS > 0 ? parseFloat(annualDPS.toFixed(2)) : 0;

                // 배당 주기 자동 세팅
                if (payoutMonths.size > 0) {
                    const monthsArr = Array.from(payoutMonths).sort((a, b) => a - b);
                    const checkboxes = document.querySelectorAll('input[name="payoutMonth"]');
                    checkboxes.forEach(cb => {
                        cb.checked = monthsArr.includes(parseInt(cb.value));
                    });

                    const cycleSelect = document.getElementById('inputDivCycle');
                    if (monthsArr.length >= 10) cycleSelect.value = 'monthly';
                    else if (monthsArr.length >= 3) cycleSelect.value = 'quarterly';
                    else if (monthsArr.length === 2) cycleSelect.value = 'semiannual';
                    else cycleSelect.value = 'annual';
                }

                const unit = resolvedMarket === 'US' ? '$' : '원';
                alert(`[${resolvedName || fetchedName}] 실시간 정보 반영 완료!\n현재 주가: ${livePrice.toLocaleString()}${unit}\n주당 연 배당금: ${annualDPS.toLocaleString()}${unit}`);

            } catch (err) {
                console.error(err);
                alert(`실시간 시세를 불러오지 못했습니다.\n종목명/코드를 확인하시거나 현재가를 직접 입력해주세요.`);
            } finally {
                // 어떤 경우에도 버튼 로딩 상태 해제
                searchBtn.innerHTML = originalHtml;
                searchBtn.disabled = false;
            }
        }

        // 9. DRIP(배당 재투자) 복리 시뮬레이터
        function openDripModal() {
            document.getElementById('dripModal').classList.remove('hidden');
            runDripSimulation();
        }

        function closeDripModal() {
            document.getElementById('dripModal').classList.add('hidden');

        function runDripSimulation() {
            const years = parseInt(document.getElementById('dripYears').value);
            const priceGrowth = (parseFloat(document.getElementById('dripPriceGrowth').value) || 0) / 100;
            const divGrowth = (parseFloat(document.getElementById('dripDivGrowth').value) || 0) / 100;

            let currentTotalKRW = 0;
            let currentAnnualDivKRW = 0;

            portfolio.forEach(stock => {
                const rate = stock.market === 'US' ? usdKrwRate : 1;
                currentTotalKRW += (stock.quantity * stock.currentPrice) * rate;
                currentAnnualDivKRW += (stock.quantity * stock.dps) * rate;
            });

            if (currentTotalKRW === 0) currentTotalKRW = 10000000;
            let initialYield = currentTotalKRW > 0 ? (currentAnnualDivKRW / currentTotalKRW) : 0.04;

            let dripAsset = currentTotalKRW;
            let noDripAsset = currentTotalKRW;
            let currentDivRate = initialYield;

            const labels = ['현재'];
            const dripData = [Math.round(dripAsset)];
            const noDripData = [Math.round(noDripAsset)];

            for (let y = 1; y <= years; y++) {
                const yearlyDiv = dripAsset * currentDivRate * (1 - 0.154);
                dripAsset = (dripAsset + yearlyDiv) * (1 + priceGrowth);
                noDripAsset = noDripAsset * (1 + priceGrowth);
                currentDivRate = currentDivRate * (1 + divGrowth);

                labels.push(`${y}년`);
                dripData.push(Math.round(dripAsset));
                noDripData.push(Math.round(noDripAsset));
            }

            const finalMonthlyNet = (dripAsset * currentDivRate * (1 - 0.154)) / 12;

            document.getElementById('dripFinalAsset').innerText = `${Math.round(dripAsset).toLocaleString()}원`;
            document.getElementById('dripFinalMonthlyDiv').innerText = `${Math.round(finalMonthlyNet).toLocaleString()}원 / 월`;

            const ctx = document.getElementById('dripChart').getContext('2d');
            if (dripChartInstance) dripChartInstance.destroy();

            dripChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '배당 재투자(DRIP)',
                            data: dripData,
                            borderColor: '#6366F1',
                            backgroundColor: 'rgba(99, 102, 241, 0.2)',
                            fill: true,
                            tension: 0.3
                        },
                        {
                            label: '단순 보유(재투자 X)',
                            data: noDripData,
                            borderColor: '#9CA3AF',
                            borderDash: [4, 4],
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#D1D5DB', font: { size: 10 }, boxWidth: 12 } }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#9CA3AF', font: { size: 9 } } },
                        y: {
                            grid: { color: '#374151' },
                            ticks: {
                                color: '#9CA3AF',
                                font: { size: 9 },
                                callback: val => val >= 100000000 ? `${(val/100000000).toFixed(1)}억` : (val >= 10000 ? `${(val/10000).toFixed(0)}만` : val)
                            }
                        }
                    }
                }
            });
        }

        // 10. 모달 및 폼 제어
        function openModal(editIdx = -1) {
            document.getElementById('stockForm').reset();
            document.getElementById('editIndex').value = editIdx;

            if (editIdx >= 0) {
                document.getElementById('modalTitle').innerText = '종목 수정';
                const item = portfolio[editIdx];
                document.querySelector(`input[name="marketType"][value="${item.market}"]`).checked = true;
                document.getElementById('inputTicker').value = item.ticker;
                document.getElementById('inputName').value = item.name;
                document.getElementById('inputQuantity').value = item.quantity;
                document.getElementById('inputBuyPrice').value = item.buyPrice;
                document.getElementById('inputCurrentPrice').value = item.currentPrice;
                document.getElementById('inputDPS').value = item.dps;
                document.getElementById('inputDivCycle').value = item.divCycle || 'quarterly';

                const checkboxes = document.querySelectorAll('input[name="payoutMonth"]');
                checkboxes.forEach(cb => {
                    cb.checked = (item.payoutMonths || []).includes(parseInt(cb.value));
                });
            } else {
                document.getElementById('modalTitle').innerText = '종목 추가';
                handleCycleChange();
            }

            handleMarketChange();
            document.getElementById('stockModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('stockModal').classList.add('hidden');
        }

        function handleMarketChange() {
            const isUS = document.querySelector('input[name="marketType"]:checked').value === 'US';
            document.getElementById('buyPriceLabel').innerText = isUS ? '평균 매수가 ($)' : '평균 매수가 (원)';
            document.getElementById('currentPriceLabel').innerText = isUS ? '현재 주가 ($)' : '현재 주가 (원)';
            document.getElementById('dpsLabel').innerText = isUS ? '주당 연간 배당금 ($)' : '주당 연간 배당금 (원)';
        }

        function handleCycleChange() {
            const cycle = document.getElementById('inputDivCycle').value;
            const checkboxes = document.querySelectorAll('input[name="payoutMonth"]');
            checkboxes.forEach(cb => cb.checked = false);

            if (cycle === 'monthly') {
                checkboxes.forEach(cb => cb.checked = true);
            } else if (cycle === 'quarterly') {
                [3, 6, 9, 12].forEach(m => document.querySelector(`input[name="payoutMonth"][value="${m}"]`).checked = true);
            } else if (cycle === 'semiannual') {
                [6, 12].forEach(m => document.querySelector(`input[name="payoutMonth"][value="${m}"]`).checked = true);
            } else if (cycle === 'annual') {
                [4].forEach(m => document.querySelector(`input[name="payoutMonth"][value="${m}"]`).checked = true);
            }
        }

        function saveStock(e) {
            e.preventDefault();
            const editIdx = parseInt(document.getElementById('editIndex').value);
            const market = document.querySelector('input[name="marketType"]:checked').value;
            const ticker = document.getElementById('inputTicker').value.trim();
            const name = document.getElementById('inputName').value.trim();
            const quantity = parseFloat(document.getElementById('inputQuantity').value) || 0;
            const buyPrice = parseFloat(document.getElementById('inputBuyPrice').value) || 0;
            const currentPrice = parseFloat(document.getElementById('inputCurrentPrice').value) || 0;
            const dps = parseFloat(document.getElementById('inputDPS').value) || 0;
            const divCycle = document.getElementById('inputDivCycle').value;

            const payoutMonths = [];
            document.querySelectorAll('input[name="payoutMonth"]:checked').forEach(cb => {
                payoutMonths.push(parseInt(cb.value));
            });

            const stockData = { market, ticker, name, quantity, buyPrice, currentPrice, dps, divCycle, payoutMonths };

            if (editIdx >= 0) {
                portfolio[editIdx] = stockData;
            } else {
                portfolio.push(stockData);
            }

            saveToStorage();
            renderAll();
            closeModal();
        }

        function deleteStock(idx) {
            if (confirm(`'${portfolio[idx].name}' 종목을 삭제하시겠습니까?`)) {
                portfolio.splice(idx, 1);
                saveToStorage();
                renderAll();
            }
        }

        // 11. 데이터 백업 및 복원
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(portfolio, null, 2));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", `dividend_portfolio_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        portfolio = imported;
                        saveToStorage();
                        renderAll();
                        alert('포트폴리오 데이터를 성공적으로 복원했습니다.');
                    }
                } catch (err) {
                    alert('올바른 백업 JSON 파일이 아닙니다.');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
